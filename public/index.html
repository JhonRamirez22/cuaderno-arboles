<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuaderno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Cuaderno</div>

      <input id="search" type="search" placeholder="Buscar en notas y carpetas" aria-label="Buscar" autocomplete="off">

      <div class="create">
        <button id="new-note" class="primary" type="button">Nueva nota</button>
        <button id="new-folder" class="ghost" type="button">Nueva carpeta</button>
      </div>
      <p id="target" class="hint"></p>

      <nav id="tree" class="tree" aria-label="Carpetas y notas"></nav>
      <p id="stats" class="stats"></p>
    </aside>

    <main id="content" class="content"></main>
  </div>

  <dialog id="dialog"><form method="dialog"></form></dialog>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
